# Nightly quarantine: pixel/font/layout comparisons tracked explicitly in
# BROWSER_TEST_QUARANTINE.md while their Linux rendering is fixed.
# Kept out of the blocking CI lane so the PR gate stays green and fast.
# Steps stay continue-on-error here so flakes never page anyone.
name: CI Nightly

on:
  schedule:
    # 02:00 UTC daily.
    - cron: "0 2 * * *"
  workflow_dispatch:

# Unlike CI (which spares main), nightly always cancels stale runs, including
# scheduled main runs: only the newest quarantine signal matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-geometry:
    name: Browser Tests (Linux geometry quarantine)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # Run the local playwright binary directly: downloading through a wrapper
      # stalled after the chromium download on hosted runners. The step timeout
      # stops any remaining apt/download stalls from eating the whole job budget.
      - name: Install browser test runtime
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # All untagged browser tests run in the blocking stable shards in CI.
      - name: Browser test (Linux geometry quarantine)
        continue-on-error: true
        timeout-minutes: 10
        run: npm run test:browser:geometry
