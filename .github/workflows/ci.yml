# Lane rule: static-fast is fast checks with no special runtime, static-typecheck is tsc,
# unit is vitest, browser owns Playwright (stable only, sharded) and is the long pole.
# Gate (quality) aggregates only: add no run steps there. A new fast check with no
# runtime goes to static-fast. Setup-workspace runs once per lane, not once for all:
# never put checks in the shared action.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Stale runs cancelled by a newer push show the gate red, not grey. Main never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Single heap ceiling for every Node lane (typecheck OOM fix): set once here
# instead of per job so a future bump cannot miss a lane.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Docs-only filter: PRs touching only prose or doc images run static-fast + gate
  # only. outputs.code is 'true' when any code file changed.
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter docs-only changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Default quantifier is 'some': any matching pattern includes the file,
          # so '!**/*.md' style exclusions never exclude anything and every PR
          # classifies as code. 'every' requires all patterns to match, which is
          # what makes the include-all + exclude-docs combination work.
          predicate-quantifier: "every"
          filters: |
            code:
              # Directory exclusions stay scoped to code-free trees: the app ships
              # a .ts module under assets/, so '**/docs/**' / '**/assets/**' would let real
              # code skip the gate. Every image under .github/ is code-free
              # (PR evidence screenshots, docs assets). Runtime images stay on
              # the code path: browser tests validate app icon transparency
              # and layout.
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!**/*.mdx'
              - '!.github/**/*.{png,jpg,jpeg,gif,svg,webp,ico}'

  # Fast checks (no special runtime) stay unblocked so docs-only PRs get a signal in ~1min.
  static-fast:
    name: Static Checks (fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Format
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

  static-typecheck:
    name: Static Checks (typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Typecheck
        run: npm run typecheck

  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Test
        run: npm test

  # Stable browser suite split 3 ways. fileParallelism:false stays in
  # vitest.browser.stable.config.ts (untouched); --shard splits test FILES
  # across shards, never parallelizes within a file. Each shard provisions its
  # own chromium on its own runner.
  browser:
    name: Browser Tests (stable ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      # Deliberate non-default: one shard's failure must not cancel the other
      # shards, so every lane reports complete signal for the gate.
      fail-fast: false
      matrix:
        # Single source of the shard count: resharding must also update the /3
        # in the job name above and the --shard arg in the run step below.
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # Run the local playwright binary directly: downloading through a wrapper
      # stalled after the chromium download on hosted runners. The step timeout
      # stops any remaining apt/download stalls from eating the whole job budget.
      - name: Install browser test runtime
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Browser test (stable shard ${{ matrix.shard }}/3)
        timeout-minutes: 20
        run: npm run test:browser:stable -- --shard=${{ matrix.shard }}/3

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build web app
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

  # Aggregate only: no checkout, no run steps. Keep the old display name for branch protection. if: always() is intended, do not remove.
  # needs every required lane. Matrix jobs report one result covering all shards,
  # so ANY failed shard fails the gate. Docs-only runs pass with heavy lanes skipped.
  quality:
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - static-fast
      - static-typecheck
      - unit
      - browser
      - build
    if: always()
    steps:
      - name: Aggregate lane results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          STATIC_FAST: ${{ needs.static-fast.result }}
          TYPECHECK: ${{ needs.static-typecheck.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          fail=0
          # The docs-only filter itself must have run: without it a skip proves nothing.
          if [ "$CHANGES" != "success" ]; then
            echo "changes=$CHANGES (filter must succeed)"
            fail=1
          fi
          if [ "$CODE" != "true" ] && [ "$CODE" != "false" ]; then
            echo "code=$CODE (filter must return true or false)"
            fail=1
          fi
          # Fast static always runs, docs-only or not.
          if [ "$STATIC_FAST" != "success" ]; then
            echo "static-fast=$STATIC_FAST"
            fail=1
          fi
          for lane in "typecheck=$TYPECHECK" "unit=$UNIT" "browser=$BROWSER" "build=$BUILD"; do
            name="${lane%%=*}"
            result="${lane#*=}"
            if [ "$CODE" != "true" ]; then
              # Docs-only run: heavy lanes must be skipped, never failed.
              if [ "$result" != "skipped" ]; then
                echo "$name=$result (docs-only run: expected skipped)"
                fail=1
              fi
            elif [ "$result" != "success" ]; then
              echo "$name=$result"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Open the red lane above, not this gate."
            exit 1
          fi
